<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>야구 기록지</title><style id="css">
:root{--bg:#f6f7f4;--fg:#1d2420;--card:#fff;--line:#d9ddd5;--mut:#6b756d;--ac:#1f6b3a;--acfg:#fff;--dg:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121613;--fg:#e8ede9;--card:#1b211d;--line:#2f3832;--mut:#98a39b;--ac:#4fb26f;--acfg:#08130c;--dg:#f08a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--fg:#e8ede9;--card:#1b211d;--line:#2f3832;--mut:#98a39b;--ac:#4fb26f;--acfg:#08130c;--dg:#f08a82;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 16px}h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);flex:1;min-width:130px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.b{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px}
.b.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}.b.d{color:var(--dg)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:3px 5px;text-align:center;white-space:nowrap;min-width:2em}
th{background:var(--bg);color:var(--mut);font-weight:600;font-size:.8rem}
td input{width:2.8em;text-align:center;padding:4px 2px;border-radius:4px}
td input.nm{width:6.5em;text-align:left;padding:4px 6px}
td.t{text-align:left;padding:4px 8px;font-weight:600}
.tot td{font-weight:700;background:var(--bg)}
.g{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.g:hover{border-color:var(--ac)}
.sc2{font-size:1.2rem;font-weight:700}.mut{color:var(--mut);font-size:.85rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sv{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}

,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0},{"n":"","ab":0,"h":0,"rbi":0,"bb":0,"k":0,"r":0,"hr":0}]},"pit":{"a":[{"n":"","res":"","ip":"","h":0,"r":0,"er":0,"bb":0,"k":0,"hr":0},{"n":"","res":"","ip":"","h":0,"r":0,"er":0,"bb":0,"k":0,"hr":0}],"h":[{"n":"","res":"","ip":"","h":0,"r":0,"er":0,"bb":0,"k":0,"hr":0}]}}]}</script><script id="code">
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((s,v)=>s+(+v||0),0);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const NM={a:'away',h:'home'},DEF={a:'원정',h:'홈'},T=['a','h'];
const F=['ab','h','hr','rbi','bb','k','r'],P=['ip','h','r','er','bb','k','hr'];
let S={games:[]},EDIT=false,dirty=false,saving=false,armed=false;
try{S=JSON.parse($('#data').textContent)}catch(e){}
const team=()=>Array.from({length:9},()=>({n:'',ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0}));
const newP=()=>({n:'',res:'',ip:'',h:0,r:0,er:0,bb:0,k:0,hr:0});
const norm=g=>{g.pit=g.pit||{a:[],h:[]};T.forEach(t=>g.bat[t].forEach(p=>{p.hr=p.hr||0}));return g};
S.games.forEach(norm);
const H2=x=>{let h=5381;for(let i=0;i<x.length;i++)h=(h*33^x.charCodeAt(i))>>>0;return h};
const BASE=H2($('#data').textContent);
function saveDraft(){try{localStorage.setItem('bbdraft',JSON.stringify({b:BASE,s:S}))}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem('bbdraft'));if(d&&d.b===BASE&&d.s&&d.s.games){S=d.s;S.games.forEach(norm);dirty=true}}catch(e){}}
const score=(g,t)=>sum(g.inn[t]);
const name=(g,t)=>g[NM[t]]||DEF[t];
const th=v=>{const x=parseFloat(v)||0,w=Math.floor(x);return w*3+Math.round((x-w)*10)};
const fip=t=>Math.floor(t/3)+'.'+t%3;
const era=(er,t)=>t>0?(er*27/t).toFixed(2):'-';
const avg=(h,ab)=>ab>0?(h/ab).toFixed(3).replace(/^0/,''):'-';
const A=(k,t,i,f)=>`data-k="${k}" data-t="${t}" data-i="${i}"${f?` data-f="${f}"`:''}`;
const s=(a,v,c)=>EDIT?`<input${c?` class="${c}"`:''} ${a} value="${esc(v)}">`:esc(v);
const n=(a,v)=>EDIT?`<input inputmode="numeric" ${a} value="${v||''}">`:(v||0);

function render(h){
  $('#app').innerHTML=h+(EDIT?`<div class="sv"><span id="st" class="mut"></span><button class="b p" onclick="pub()">저장하고 공개</button></div>`:'');
  setSt();
}
function setSt(){if(dirty&&EDIT)saveDraft();const e=$('#st');if(e)e.textContent=dirty?'● 아직 공개 전이라 방문자에게는 안 보여요 (목록으로 나가면 자동 공개)':'공개됨'}

function home(){
  let h=`<h1>⚾ 야구 기록지</h1><div class="bar"><span class="mut">경기 ${S.games.length}개 · ${EDIT?'편집 모드':'보기 전용'}</span><span><button class="b" onclick="location.hash='rank'">🏆 선수 순위</button> ${EDIT?'<button class="b p" onclick="add()">+ 새 경기</button>':''}</span></div>`;
  if(!S.games.length)h+=`<div class="card mut">아직 등록된 경기가 없습니다.</div>`;
  for(const g of S.games)h+=`<div class="card g" onclick="location.hash='g${g.id}'"><div><b>${esc(name(g,'a'))} vs ${esc(name(g,'h'))}</b><div class="mut">${esc(g.date)} ${esc(g.place)}</div></div><div class="sc2">${score(g,'a')} : ${score(g,'h')}</div></div>`;
  render(h);
}
function add(){
  const g=norm({id:Date.now(),date:new Date().toISOString().slice(0,10),place:'',away:'',home:'',inn:{a:Array(9).fill(''),h:Array(9).fill('')},bat:{a:team(),h:team()}});
  S.games.unshift(g);dirty=true;location.hash='g'+g.id;
}
function del(id){
  if(!armed){armed=true;$('#del').textContent='정말 삭제?';return}
  S.games=S.games.filter(x=>x.id!==id);dirty=true;location.hash='';
}
const cg=()=>S.games.find(x=>'#g'+x.id===location.hash);
function addP(t){cg().pit[t].push(newP());dirty=true;detail(cg())}
function delP(t,i){cg().pit[t].splice(i,1);dirty=true;detail(cg())}

function detail(g){
  armed=false;
  let h=`<div class="bar"><button class="b" onclick="location.hash=''">← 목록</button>${EDIT?`<button class="b d" id="del" onclick="del(${g.id})">삭제</button>`:''}</div><div class="card"><div class="row">`;
  h+=EDIT?[['날짜','date','date'],['장소','place',''],['원정팀','away',''],['홈팀','home','']].map(([l,k,ty])=>`<label>${l}<input ${ty?`type="${ty}" `:''}data-k="${k}" value="${esc(g[k])}"></label>`).join(''):`<b>${esc(name(g,'a'))} vs ${esc(name(g,'h'))}</b><span class="mut">${esc(g.date)} ${esc(g.place)}</span>`;
  h+=`</div></div><div class="card"><h2>이닝별 점수</h2><div class="sc"><table><tr><th>팀</th>${[1,2,3,4,5,6,7,8,9].map(i=>`<th>${i}</th>`).join('')}<th>R</th><th>H</th></tr>`;
  for(const t of T)h+=`<tr><td class="t" data-nm="${t}"></td>${g.inn[t].map((v,i)=>`<td>${EDIT?`<input inputmode="numeric" ${A('inn',t,i)} value="${esc(v)}">`:(esc(v)||'-')}</td>`).join('')}<td><b id="R${t}"></b></td><td id="H${t}"></td></tr>`;
  h+=`</table></div></div>`;
  for(const t of T){
    h+=`<div class="card"><h2><span data-nm="${t}"></span> 타자 기록</h2><div class="sc"><table><tr><th>타순</th><th>이름</th><th>타수</th><th>안타</th><th>홈런</th><th>타점</th><th>볼넷</th><th>삼진</th><th>득점</th><th>타율</th></tr>`;
    g.bat[t].forEach((p,i)=>{
      h+=`<tr><td>${i+1}</td><td>${s(A('bat',t,i,'n'),p.n,'nm')}</td>`;
      for(const f of F)h+=`<td>${n(A('bat',t,i,f),p[f])}</td>`;
      h+=`<td id="A${t}${i}"></td></tr>`;
    });
    h+=`<tr class="tot"><td colspan="2">합계</td>${F.map(f=>`<td id="T${t}${f}"></td>`).join('')}<td id="TA${t}"></td></tr></table></div></div>`;
    h+=`<div class="card"><h2><span data-nm="${t}"></span> 투수 기록</h2><div class="sc"><table><tr><th>투수</th><th>결과</th><th>이닝</th><th>피안타</th><th>실점</th><th>자책</th><th>볼넷</th><th>삼진</th><th>피홈런</th><th>방어율</th>${EDIT?'<th></th>':''}</tr>`;
    g.pit[t].forEach((p,i)=>{
      h+=`<tr><td>${s(A('pit',t,i,'n'),p.n,'nm')}</td><td>${s(A('pit',t,i,'res'),p.res)}</td>`;
      for(const f of P)h+=`<td>${f==='ip'?s(A('pit',t,i,'ip'),p.ip):n(A('pit',t,i,f),p[f])}</td>`;
      h+=`<td id="E${t}${i}"></td>${EDIT?`<td><button class="b" onclick="delP('${t}',${i})">✕</button></td>`:''}</tr>`;
    });
    h+=`<tr class="tot"><td colspan="2">합계</td>${P.map(f=>`<td id="PT${t}${f}"></td>`).join('')}<td id="PE${t}"></td>${EDIT?'<td></td>':''}</tr></table></div>${EDIT?`<p><button class="b" onclick="addP('${t}')">+ 투수 추가</button></p>`:''}<div class="mut">이닝은 5.1 = 5⅓이닝, 5.2 = 5⅔이닝처럼 입력하세요.</div></div>`;
  }
  render(h);totals(g);
}
function totals(g){
  document.querySelectorAll('[data-nm]').forEach(e=>e.textContent=name(g,e.dataset.nm));
  for(const t of T){
    const b=g.bat[t],q=g.pit[t],hh=sum(b.map(p=>p.h)),ab=sum(b.map(p=>p.ab));
    $('#R'+t).textContent=score(g,t);$('#H'+t).textContent=hh;
    b.forEach((p,i)=>$('#A'+t+i).textContent=avg(p.h,p.ab));
    for(const f of F)$('#T'+t+f).textContent=sum(b.map(p=>p[f]));
    $('#TA'+t).textContent=avg(hh,ab);
    const ti=sum(q.map(p=>th(p.ip))),er=sum(q.map(p=>p.er));
    q.forEach((p,i)=>$('#E'+t+i).textContent=era(+p.er||0,th(p.ip)));
    for(const f of P)$('#PT'+t+f).textContent=f==='ip'?fip(ti):sum(q.map(p=>p[f]));
    $('#PE'+t).textContent=era(er,ti);
  }
}
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset,g=EDIT&&cg();
  if(!g||!d.k)return;
  const txt=['n','res','ip'].includes(d.f);
  if(d.k==='inn')g.inn[d.t][d.i]=el.value;
  else if(d.k==='bat'||d.k==='pit')(d.k==='bat'?g.bat:g.pit)[d.t][d.i][d.f]=txt?el.value:(+el.value||0);
  else g[d.k]=el.value;
  dirty=true;setSt();totals(g);
});
let RK={b:'h',p:'k'};
function srt(w,k){RK[w]=k;rank()}
function agg(){const B={},Q={},kk=s=>String(s||'').replace(/\s+/g,'').toLowerCase();for(const g of S.games)for(const t of T){const sb=new Set(),sp=new Set();for(const p of g.bat[t]){const id=kk(p.n);if(!id)continue;const o=B[id]=B[id]||{n:String(p.n).trim(),g:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0};if(!sb.has(id)){o.g++;sb.add(id)}for(const f of F)o[f]+=+p[f]||0}for(const p of g.pit[t]){const id=kk(p.n);if(!id)continue;const o=Q[id]=Q[id]||{n:String(p.n).trim(),g:0,ip:0,h:0,r:0,er:0,bb:0,k:0,hr:0,w:0,l:0,s:0,hd:0};if(!sp.has(id)){o.g++;sp.add(id)}o.ip+=th(p.ip);for(const f of ['h','r','er','bb','k','hr'])o[f]+=+p[f]||0;const x=String(p.res||'').trim();if(x==='승')o.w++;else if(x==='패')o.l++;else if(x==='세')o.s++;else if(x==='홀')o.hd++}}return{B:Object.values(B),Q:Object.values(Q)}}
function rank(){const{B,Q}=agg();B.forEach(o=>o.avg=o.ab?o.h/o.ab:-1);Q.forEach(o=>o.era=o.ip?o.er*27/o.ip:1e9);const bs=B.sort((a,b)=>b[RK.b]-a[RK.b]||b.h-a.h),ps=Q.sort((a,b)=>RK.p==='era'?a.era-b.era:b[RK.p]-a[RK.p]||a.era-b.era);const BH=[['g','경기'],['ab','타수'],['h','안타'],['hr','홈런'],['rbi','타점'],['bb','볼넷'],['k','삼진'],['r','득점'],['avg','타율']],PH=[['g','경기'],['ip','이닝'],['w','승'],['l','패'],['s','세'],['hd','홀'],['h','피안타'],['r','실점'],['er','자책'],['bb','볼넷'],['k','삼진'],['hr','피홈런'],['era','방어율']];const tb=(w,H,rows,fmt,nm)=>`<div class="card"><h2>${nm}</h2>${rows.length?`<div class="sc"><table><tr><th>순위</th><th>선수</th>${H.map(([k,l])=>`<th style="cursor:pointer" onclick="srt('${w}','${k}')">${l}${RK[w]===k?' ▼':''}</th>`).join('')}</tr>${rows.map((o,i)=>`<tr><td>${i+1}</td><td class="t">${esc(o.n)}</td>${H.map(([k])=>`<td${RK[w]===k?' style="font-weight:700"':''}>${fmt(o,k)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="mut">아직 기록이 없어요.</div>'}</div>`;render(`<div class="bar"><button class="b" onclick="location.hash=''">← 목록</button></div><h1>🏆 선수 순위</h1><div class="mut" style="margin-bottom:12px">같은 이름은 모든 경기 기록을 합쳐요. 제목을 누르면 그 기록으로 정렬돼요.</div>`+tb('b',BH,bs,(o,k)=>k==='avg'?avg(o.h,o.ab):o[k],'타자 순위')+tb('p',PH,ps,(o,k)=>k==='ip'?fip(o.ip):k==='era'?era(o.er,o.ip):o[k],'투수 순위'))}
function route(){const g=cg();location.hash==='#rank'?rank():g?detail(g):home()}
window.addEventListener('hashchange',()=>{if(EDIT&&dirty&&!cg()&&!saving){pub().then(route)}else route()});

function build(){
  const j=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>야구 기록지</title><style id="css">'+$('#css').textContent+'</style></head><body><main id="app"></main><script id="data" type="application/json">'+j+'<\/script><script id="code">'+$('#code').textContent+'<\/script></body></html>';
}
async function pub(){
  if(saving)return;saving=true;$('#st').textContent='저장 중…';
  try{
    const a=await claude.use('artifact');if(!a)throw new Error('x');
    await a.publish(build());
  }catch(e){$('#st').textContent='저장 실패 — 편집 권한을 확인하고 다시 시도하세요'}
  saving=false;
}
route();
(async()=>{
  try{
    const u=window.claude&&await claude.use('user');
    EDIT=!!(u&&u.canEdit());if(EDIT)loadDraft();
    if(EDIT&&!S.games.length){
      try{const o=JSON.parse(localStorage.getItem('bbrec_v1'));if(o&&o.length){S.games=o.map(norm);dirty=true}}catch(e){}
    }
  }catch(e){}
  route();
})();
</script></body></html>
